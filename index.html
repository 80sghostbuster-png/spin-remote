<title>Spin Remote</title>
<style>@property --accent { syntax: '<color>'; inherits: true; initial-value: #b45cff; }
:root {
  --accent: #b45cff;
  --bg: #06060a;
  --ink: #eceaf5;
  --dim: #8b88a0;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  transition: --accent .5s ease;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  font-family: ui-rounded, 'SF Pro Rounded', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  background:
    radial-gradient(120% 60% at 50% 105%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 62%),
    radial-gradient(80% 40% at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    var(--bg); }
@media (min-width: 600px) { #app { border-left: 1px solid #1a1a24; border-right: 1px solid #1a1a24; } }

/* header */
#top { display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 12px 8px; height: calc(54px + var(--safe-t)); flex: none; z-index: 30; }
.brand { font-weight: 800; letter-spacing: .14em; font-size: 13px; line-height: 1; display: flex; flex-direction: column; gap: 3px; margin-right: 2px; }
.brand b { color: var(--accent); text-shadow: 0 0 12px var(--accent); font-size: 15px; }
.brand i { font-style: normal; font-weight: 600; font-size: 8.5px; color: var(--dim); letter-spacing: .38em; text-transform: uppercase; }
.pill { flex: 1; min-width: 0; height: 36px; border-radius: 18px; display: flex; align-items: center; gap: 8px; padding: 0 14px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); font-size: 13px; color: #d8d6e6; backdrop-filter: blur(8px); }
.pill span#pill-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; box-shadow: 0 0 0 0 transparent; }
.pill.ok .dot { background: #3dff9a; box-shadow: 0 0 10px #3dff9a; }
.pill.warn .dot { background: #ffc83d; box-shadow: 0 0 10px #ffc83d; }
.icon-btn { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--accent);
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); transition: transform .12s, box-shadow .2s; }
.icon-btn:active { transform: scale(.9); box-shadow: 0 0 14px var(--accent); }
.icon-btn.off { color: #666; }
#demo-banner { flex: none; height: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10.5px; letter-spacing: .06em;
  color: #ffd27a; background: linear-gradient(90deg, transparent, rgba(255,184,40,.14), transparent); border-block: 1px solid rgba(255,184,40,.22); z-index: 30; }
#demo-banner b { letter-spacing: .2em; }
#demo-banner[hidden] { display: none; }
.blink { width: 6px; height: 6px; border-radius: 50%; background: #ffb828; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* stage */
#stage { position: relative; flex: 1; min-height: 0; perspective: 1300px; perspective-origin: 50% 45%; overflow: hidden; touch-action: none; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#cards, #ring { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.card { position: absolute; width: 320px; height: 640px; left: -160px; top: -320px; transform-style: flat; backface-visibility: hidden; cursor: pointer; }
.card.inactive * { pointer-events: none; }  /* browsing: the whole remote is one big tap target */
body.locked .card { cursor: auto; }
.card::after { content: ''; position: absolute; inset: 0; border-radius: 40px; pointer-events: none; opacity: var(--dim-o, 0); background: #06060a; transition: none; }
#toast { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 14px); opacity: 0; z-index: 40; pointer-events: none; max-width: 92%;
  font: 600 11px/1.3 ui-monospace, 'SF Mono', Menlo, monospace; color: var(--accent); background: rgba(8,8,14,.88); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  padding: 7px 12px; border-radius: 10px; box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent); transition: opacity .15s, transform .15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { color: #ff7d8a; border-color: rgba(255,125,138,.6); box-shadow: 0 0 18px rgba(255,80,100,.3); }

/* orbs (ring layout) */
.orb { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; align-content: center; text-align: center;
  color: #0a0a10; font-weight: 800; will-change: transform, opacity, filter; pointer-events: auto; touch-action: none;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: 0 0 22px color-mix(in srgb, var(--c) 55%, transparent), inset 0 -4px 8px rgba(0,0,0,.25); }
.orb .n { font-size: 20px; line-height: 1; }
.orb .l { font-size: 8px; letter-spacing: .12em; margin-top: 2px; font-weight: 800; opacity: .8; }
.orb.sel { outline: 2px solid #fff; outline-offset: 3px; }

/* dock */
#foot { position: relative; flex: none; margin: 4px 12px calc(10px + var(--safe-b)); height: 56px; z-index: 30; }
#dock { position: absolute; inset: 0 92px 0 0; display: flex; border-radius: 28px; z-index: 30; transition: transform .45s cubic-bezier(.3,.9,.3,1), opacity .3s;
  background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(10px); touch-action: none; }
#dock-ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(25% - 2px); border-radius: 22px; z-index: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 36%, transparent), color-mix(in srgb, var(--accent) 14%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
  transition: transform .38s cubic-bezier(.3,1.5,.5,1); }
.dock-item { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #9a97b0; transition: color .25s; }
.dock-item .dn { font-size: 8.5px; letter-spacing: .2em; opacity: .7; font-weight: 700; }
.dock-item .dl { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; }
.dock-item.on { color: #fff; }

/* sheet */
#backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; backdrop-filter: blur(3px); }
#backdrop.on { opacity: 1; pointer-events: auto; }
#sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; z-index: 60; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.9,.25,1);
  background: linear-gradient(#14131d, #0c0b12); border-top: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); border-radius: 26px 26px 0 0;
  box-shadow: 0 -10px 50px rgba(0,0,0,.6), 0 -1px 30px color-mix(in srgb, var(--accent) 25%, transparent); padding: 8px 18px calc(22px + var(--safe-b)); overflow-y: auto; touch-action: pan-y; }
#sheet.on { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: #3a3850; margin: 4px auto 14px; }
#sheet h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: .01em; }
#sheet p.sub { margin: 0 0 14px; color: var(--dim); font-size: 13px; line-height: 1.4; }
.sec { font-size: 10.5px; letter-spacing: .2em; color: var(--dim); margin: 16px 0 8px; font-weight: 700; text-transform: uppercase; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); margin-bottom: 8px; }
.row .badge { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 10px; letter-spacing: .06em; color: #0a0a10; background: var(--c); flex: none; }
.row .meta { flex: 1; min-width: 0; } .row .nm { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .st { font-size: 11.5px; color: var(--dim); margin-top: 2px; } .row .st.ok { color: #3dff9a; } .row .st.warn { color: #ffc83d; }
.sbtn { height: 34px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 12.5px; color: #0a0a10; background: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); flex: none; }
.sbtn.ghost { color: var(--ink); background: rgba(255,255,255,.07); box-shadow: none; border: 1px solid rgba(255,255,255,.1); }
.sbtn.wide { width: 100%; height: 46px; border-radius: 16px; font-size: 15px; }
.sbtn:disabled { opacity: .5; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; font-size: 14.5px; }
.sw { width: 46px; height: 28px; border-radius: 14px; background: #2a2838; position: relative; transition: background .2s; } .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #aaa; transition: .2s; }
.sw.on { background: color-mix(in srgb, var(--accent) 70%, #000); } .sw.on::after { left: 21px; background: #fff; }
.form { display: flex; gap: 8px; } .form select, .form input { height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: var(--ink); padding: 0 10px; font: inherit; font-size: 16px; min-width: 0; -webkit-user-select: text; user-select: text; touch-action: auto; }
.form input { flex: 1; }
.scan { display: flex; align-items: center; gap: 10px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.codebox { display: flex; gap: 8px; justify-content: center; margin: 18px 0 14px; position: relative; }
.codebox i { width: 42px; height: 54px; border-radius: 14px; display: grid; place-items: center; font: 700 24px ui-monospace, Menlo, monospace; font-style: normal; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); text-transform: uppercase; }
.codebox i.cur { border-color: var(--accent); box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); }
.codebox input { position: absolute; inset: 0; opacity: 0; font-size: 16px; width: 100%; height: 100%; -webkit-user-select: text; user-select: text; touch-action: auto; }
.hint { text-align: center; color: #ffd27a; font-size: 12px; margin: -4px 0 12px; }
.err { color: #ff7d8a; text-align: center; font-size: 13px; min-height: 18px; margin: 4px 0 8px; }
.steps { text-align: center; font-size: 10.5px; letter-spacing: .2em; color: var(--dim); margin-bottom: 6px; }
.textbox { display: flex; gap: 8px; margin: 14px 0 6px; }
.textbox input { flex: 1; height: 48px; border-radius: 14px; border: 1px solid var(--accent); background: rgba(255,255,255,.05); color: #fff; padding: 0 14px; font: inherit; font-size: 17px; box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 30%, transparent); -webkit-user-select: text; user-select: text; touch-action: auto; }

/* ============ remotes ============ */
.remote { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 16px 16px;
  --rc: var(--accent); color: #e8e6f2; }
.remote .r-top { width: 100%; display: flex; align-items: center; justify-content: space-between; min-height: 38px; }
.wordmark { font-weight: 800; font-size: 19px; letter-spacing: .02em; text-transform: lowercase; display: flex; flex-direction: column; align-items: center; line-height: .95; }
.wordmark i { font-style: normal; font-size: 7.5px; letter-spacing: .4em; opacity: .55; margin-top: 3px; text-transform: uppercase; font-weight: 700; }
.spacer-sm { width: 34px; }
.btn { position: relative; display: grid; place-items: center; color: #e7e5f3; font-weight: 800; letter-spacing: .06em;
  background: linear-gradient(180deg, #2b2a38, #181722); border: 1px solid rgba(255,255,255,.09);
  box-shadow: 0 3px 0 #08080d, 0 6px 14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
  transition: transform .08s, box-shadow .15s, background .15s, color .15s; touch-action: none; }
.btn.round { width: 54px; height: 54px; border-radius: 50%; } .btn.round.sm { width: 38px; height: 38px; } .btn.round.big { width: 66px; height: 66px; color: var(--rc); }
.btn.pill { height: 46px; border-radius: 23px; width: 100%; }
.btn.pressed, .dp.pressed { transform: translateY(2px) scale(.94); color: #fff;
  box-shadow: 0 0 0 1px var(--rc), 0 0 20px var(--rc), inset 0 0 14px color-mix(in srgb, var(--rc) 55%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 30%, #1c1b27), #14131c); }
.btn.power { color: #ff6b7a; }
.btn.fired::after { content: ''; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--rc); animation: fired .45s ease-out forwards; pointer-events: none; }
@keyframes fired { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
.btn svg { pointer-events: none; }
.btn span { pointer-events: none; }
.row3, .row2, .grid2, .apps4, .apps2 { width: 100%; display: grid; gap: 10px; align-items: center; justify-items: center; }
.row3 { grid-template-columns: repeat(3, 1fr); } .row2 { grid-template-columns: repeat(3, 1fr); } .grid2 { grid-template-columns: 1fr 1fr; } .apps4 { grid-template-columns: repeat(4, 1fr); gap: 6px; } .apps2 { grid-template-columns: 1fr 1fr; }
.row3.vol .btn.pill { height: 40px; }

/* d-pad: four clip-path wedges + center OK */
.dpad { position: relative; width: 214px; height: 214px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 50% 35%, #2a2937, #14131c 70%); border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 0 0 5px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08), 0 0 30px color-mix(in srgb, var(--rc) 22%, transparent); }
.dp { position: absolute; inset: 0; border-radius: 50%; display: grid; color: #bdbad0; touch-action: none; transition: background .12s, color .12s, transform .08s; }
.dp svg { position: absolute; pointer-events: none; width: 24px; height: 24px; stroke-width: 2.6; }
.dp-up { clip-path: polygon(50% 50%, 6% 6%, 94% 6%); } .dp-up svg { left: 95px; top: 24px; }
.dp-down { clip-path: polygon(50% 50%, 6% 94%, 94% 94%); } .dp-down svg { left: 95px; bottom: 24px; }
.dp-left { clip-path: polygon(50% 50%, 6% 6%, 6% 94%); } .dp-left svg { left: 24px; top: 95px; }
.dp-right { clip-path: polygon(50% 50%, 94% 6%, 94% 94%); } .dp-right svg { right: 24px; top: 95px; }
.dp.pressed { transform: none; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--rc) 55%, transparent), color-mix(in srgb, var(--rc) 12%, transparent)); box-shadow: none; }
.dp-ok { position: absolute; left: 50%; top: 50%; margin: -42px 0 0 -42px; width: 84px; height: 84px; border-radius: 50%; font-size: 17px; z-index: 2; }
.dpad::before { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; z-index: 1;
  background: conic-gradient(from 45deg, transparent 0 21%, rgba(0,0,0,.55) 24% 26%, transparent 29% 46%, rgba(0,0,0,.55) 49% 51%, transparent 54% 71%, rgba(0,0,0,.55) 74% 76%, transparent 79% 96%, rgba(0,0,0,.55) 99%, transparent);
  -webkit-mask: radial-gradient(circle, transparent 46px, #000 47px); mask: radial-gradient(circle, transparent 46px, #000 47px); }

/* --- Roku: violet, squared --- */
.remote.roku { width: 300px; height: 626px; border-radius: 30px; --rc: #b45cff;
  background: linear-gradient(165deg, #231238 0%, #130a21 45%, #0b0613 100%); border: 1px solid rgba(180,92,255,.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 40px rgba(130,50,210,.2), 0 0 50px rgba(150,70,240,.38), 0 24px 40px rgba(0,0,0,.6); }
.roku .wordmark { color: #cf9bff; text-shadow: 0 0 14px rgba(180,92,255,.8); font-size: 22px; }
.roku .btn.pill { background: linear-gradient(180deg, #3a2457, #20122f); }
.roku .app { height: 34px; width: 100%; border-radius: 10px; font-size: 8.5px; letter-spacing: .04em; }
.a-red { background: linear-gradient(180deg, #e50914, #8c0610) !important; } .a-ytred { background: linear-gradient(180deg, #ff2d2d, #a00) !important; }
.a-blue { background: linear-gradient(180deg, #1a98ff, #0b5aa8) !important; } .a-navy { background: linear-gradient(180deg, #1c3a8a, #0d1c55) !important; }
.app span { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.apps4 { margin-top: auto; }
/* --- Fire TV: carbon black, orange --- */
.remote.firetv { width: 286px; height: 590px; border-radius: 44px; --rc: #ff9a1f; padding-top: 18px;
  background: linear-gradient(170deg, #1b1b21 0%, #0d0d11 60%, #08080a 100%), repeating-linear-gradient(45deg, #000 0 2px, #111 2px 4px); border: 1px solid rgba(255,154,31,.5);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 0 48px rgba(255,140,20,.33), 0 24px 40px rgba(0,0,0,.6); justify-content: space-between; }
.firetv .wordmark { color: #ffb552; text-shadow: 0 0 14px rgba(255,150,30,.8); }
.firetv .dpad { box-shadow: 0 0 0 5px rgba(0,0,0,.45), 0 0 0 7px rgba(255,154,31,.35), 0 8px 24px rgba(0,0,0,.55), 0 0 30px rgba(255,154,31,.25); }
.firetv .btn.round { background: linear-gradient(180deg, #2a2a31, #15151a); }
.firetv .btn.pill { background: linear-gradient(180deg, #2a2a31, #15151a); }
